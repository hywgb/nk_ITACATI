# Minimal coturn config for demo (tune for production)
listening-port=3478
tls-listening-port=5349
no-udp=false
no-tcp=false
fingerprint
lt-cred-mech
realm=turn.example.com
user=test:changeMe123
# Cipher/Cert for TLS (provide real files in prod)
# cert=/etc/letsencrypt/live/turn.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.example.com/privkey.pem
no-loopback-peers
no-multicast-peers
# External IP if behind NAT
# external-ip=PUBLIC_IP
# Min ports range for relay (plan with firewall)
min-port=49152
max-port=49200